<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager DOM Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="heading">
      <h1>TASK MANAGER</h1>
      <button id="theme-toggle">light</button>
    </div>
    <div class="trackers">
      <div class="total">
        <h1>TOTAL</h1>
        <h1 id="total-tasks">0</h1>
      </div>
      <div class="completed">
        <h1>COMPLETED</h1>
        <h1 id="completed-tasks">0</h1>
      </div>
      <div class="pending">
        <h1>PENDING</h1>
        <h1 id="pending-tasks">0</h1>
      </div>
    </div>
    <div class="progress-container">
      <div class="progress-header">
        <span>Task Progress</span>
        <span id="progress-percent">0%</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
    <div class="tasks">
      <div class="add-task">
        <input type="text" id="task-input" placeholder="Add a new task" />
        <button id="add-task-button">Add Task</button>
      </div>
      <div class="priority">
        <label for="priority-select">Priority:</label>
        <select id="priority-select">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>
    <div class="task-list-container">
      <div class="task-list">
        <button id="complete-toggle"></button>
        <h3>Dsa should be completed</h3>
        <div class="task-actions">
          <button class="edit-button">Edit</button>
          <button class="delete-button">Delete</button>
        </div>
      </div>
    </div>
  </body>
</html>
